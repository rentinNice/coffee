<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Demande de Forfait – Café Croissant Paris</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Poppins', 'sans-serif']
          },
          colors: {
            coffee: {
              dark: '#2C1810',
              medium: '#6F4E37',
              cream: '#F5E6D3'
            },
            croissant: '#E8A317'
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-image: url('paris_background.jpg');
      background-size: cover;
      background-position: center;
    }
    .overlay {
      background: linear-gradient(rgba(44,24,16,0.6), rgba(44,24,16,0.8));
    }
  </style>
</head>

<body class="font-sans text-coffee-cream">

  <div class="overlay min-h-screen flex items-center justify-center px-6">

    <div class="bg-coffee-dark/80 backdrop-blur-lg p-10 rounded-3xl max-w-xl w-full shadow-2xl">

      <h1 class="font-serif text-4xl text-croissant text-center mb-8">
        Demande de Forfait
      </h1>

      <form class="space-y-6">

        <div>
          <label class="block mb-2 text-sm">Nom</label>
          <input type="text" required
            class="w-full px-4 py-3 rounded-lg bg-coffee-medium text-white focus:outline-none focus:ring-2 focus:ring-croissant">
        </div>

        <div>
          <label class="block mb-2 text-sm">Entreprise</label>
          <input type="text" required
            class="w-full px-4 py-3 rounded-lg bg-coffee-medium text-white focus:outline-none focus:ring-2 focus:ring-croissant">
        </div>

        <div>
          <label class="block mb-2 text-sm">Email</label>
          <input type="email" required
            class="w-full px-4 py-3 rounded-lg bg-coffee-medium text-white focus:outline-none focus:ring-2 focus:ring-croissant">
        </div>

        <div>
          <label class="block mb-2 text-sm">Nombre d’employés (min. 5)</label>
          <input type="number" min="5" required
            class="w-full px-4 py-3 rounded-lg bg-coffee-medium text-white focus:outline-none focus:ring-2 focus:ring-croissant">
        </div>

        <div>
          <label class="block mb-2 text-sm">Adresse du bureau (Paris)</label>
          <input type="text" required
            class="w-full px-4 py-3 rounded-lg bg-coffee-medium text-white focus:outline-none focus:ring-2 focus:ring-croissant">
        </div>

        <button type="submit"
          class="w-full bg-croissant text-coffee-dark font-bold py-4 rounded-full text-lg hover:scale-105 transition">
          Envoyer ma demande
        </button>

      </form>

      <div class="text-center mt-6 text-sm">
        Livraison gratuite • 4,00€ par personne / jour
      </div>

    </div>

  </div>

</body>
</html>
